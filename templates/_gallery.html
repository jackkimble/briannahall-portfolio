{# Rows of photos that share a height. Each image opens in the viewer. #}
<div class="gallery" data-gallery>
  {% for row in rows %}
  <div class="gallery__row gallery__row--{{ row["items"] | length }}" style="--row-ratio: {{ row.ratio }}">
    {% for p in row["items"] %}
    <figure class="gallery__item" style="--share: {{ p.share }}%; --ratio: {{ p.ratio }}">
      <a href="{{ full(p.image) }}" data-lightbox data-caption="{{ p.caption or '' }}">
        {{ img(p.image, p.alt, sizes="(min-width: 900px) " ~ ((p.share * 0.9) | round(0, 'ceil') | int) ~ "vw, 100vw") }}
      </a>
      {% if p.caption %}<figcaption>{{ p.caption }}</figcaption>{% endif %}
    </figure>
    {% endfor %}
  </div>
  {% endfor %}
</div>
