about_heading: About Me
about: |-
  I am currently a student at Texas A&M University and a dedicated member of the Texas A&M Formula Electric Marketing Team. During my time on this team, I volunteered for additional photography projects and designed merchandise for team competitions. Through collaboration with my teammates, I gained valuable experience and was later selected as the Traditional Media Lead. In this role, I oversee team merchandise and create both physical and digital graphics for recruitment and social media. I also introduced a feedback system for merchandise design, allowing student engineers to share their input and help us create designs that better reflect the team.

  I am currently a Junior Graphic Designer at Aggieland Outfitters where I am a part of a team that creates five to ten merchandise designs weekly. This role has taught me how to create and design print ready files, and the importance of understanding your client. Through this role, I am able to track current trends and create designs that will bring the store the most sales.

  Beyond academics, I love expressing creativity through painting and cooking. When I’m not working on a marketing project or creating art, you’ll probably find me spending time with my dog, Charlie, or reading a good book. I am always eager to learn, collaborate, and explore new opportunities in the world of marketing and advertising!
