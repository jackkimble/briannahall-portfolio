intro: Hi! My name is Brianna Hall, I’m a fourth year marketing student at Texas A&M University with a concentration in advertising strategy, and I currently work in graphic design. I have a passion for brand marketing, publishing and sports marketing, and I hope to pursue a career in one of these passions. Take a look around and feel free to contact me!
